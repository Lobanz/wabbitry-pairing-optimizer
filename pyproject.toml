[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wabbitry-pairing-optimizer"
# Version is single-sourced from the package __init__ (issue #40): hatch reads
# it via [tool.hatch.version] path, so --version and the wheel cannot drift.
dynamic = ["version"]
description = "Least-bad breeding pairings for Wascally Wabbitry."
requires-python = ">=3.11"
# Deliberate pins — bumped in their own commit (driller discipline, standard
# uv layout). A dev venv is created/reconciled with `uv sync` (dev group).
dependencies = [
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
]

[tool.hatch.version]
path = "src/wabbitry_pairing_optimizer/__init__.py"

# Installed command (issue #40): `uv tool install <wheel>` puts this on PATH in
# its own isolated env — no virtualenv to set up or activate.
[project.scripts]
wabbitry-pairing-optimizer = "wabbitry_pairing_optimizer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wabbitry_pairing_optimizer"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "ANN", "B", "UP", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
