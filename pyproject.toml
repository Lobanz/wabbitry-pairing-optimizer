[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wabbitry-pairing-optimizer"
version = "0.1.0"
description = "Least-bad breeding pairings for Wascally Wabbitry."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wabbitry_pairing_optimizer"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "ANN", "B", "UP", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
